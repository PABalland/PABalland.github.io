
<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <script src="https://www.paballand.com/js/d3plus-geomap.v0.6.full.min.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

</head>

<body></body>

<script>



  var popData = [] ;


var chart = new d3plus.Geomap()
  .config({
    data: popData,
    colorScale: "value",
    ocean: "transparent",
    projection: "geoTransverseMercator",
    tooltipConfig: {
      body: function(d) {
        var table = "<table class='tooltip-table'>";
        table += "<tr><td class='title'>Relatedness Added (Comp):</td><td class='data'>" + d.value  + "</td></tr>"; 
        table += "<tr><td class='title'>Links:</td><td class='data'>" + d.binary  + "</td></tr>"; 
        table += "</table>";
        return table;
      },
      title: function(d) {
        var txt = d.name;
        return txt.charAt(0).toUpperCase() + txt.substr(1).toUpperCase();
      }
    }
  })
  .topojson("https://www.paballand.com/json/topojson/NUTS_RG_20M_2010_4326-nuts-2-regpat2.json")
  .fitFilter(function(d){
    return ["FRY1", "FRY2", "FRY3", "FRY4", "FRY5", "ES70", "FRY", "ES7", "FRY10", "FRY20", "FRY30", "FRY40", "FRY50", "ES70"].indexOf(d.id) < 0;
  })
  .colorScaleConfig({color: ["white", "darkblue"]})
  .render();
</script>

</html>
