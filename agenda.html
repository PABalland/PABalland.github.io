<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline</title>
<style>
:root{
  --bg:#2b3135;--text:#e8ebed;--muted:#8e989e;--faint:#5f696f;--line:#434b50;
  --bullet:#aab3b8;--halo:#474f54;--hover:#343b3f;--accent:#49b4ea;--menu:#353c40;
  --shadow:0 10px 30px rgba(0,0,0,.4);
  --c-red:#ff7b72;--c-orange:#ffa657;--c-yellow:#e3c75b;--c-green:#5fc98f;--c-blue:#6cb6ff;--c-purple:#c297ff;
}
[data-theme=light]{
  --bg:#fff;--text:#2a3135;--muted:#6b7479;--faint:#b3babe;--line:#e3e6e8;
  --bullet:#4b5358;--halo:#dde2e4;--hover:#f2f4f5;--accent:#2f8fd8;--menu:#fff;
  --shadow:0 10px 30px rgba(0,0,0,.12);
  --c-red:#d73a49;--c-orange:#d9730d;--c-yellow:#a67c00;--c-green:#1f9d55;--c-blue:#2f7fd8;--c-purple:#8250df;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* top bar */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:2px;height:52px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.ib{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--accent)}
.ib svg{width:19px;height:19px}
.crumbs{display:flex;align-items:center;min-width:0;flex:1;overflow:hidden;white-space:nowrap;color:var(--muted);font-size:15px}
.crumbs a{cursor:pointer;padding:4px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumbs a:hover{background:var(--hover);color:var(--text)}
.crumbs .sep{color:var(--faint);padding:0 1px}
.search{display:flex;align-items:center;gap:8px;height:36px;width:260px;padding:0 10px 0 12px;margin-right:6px;border:1px solid var(--line);border-radius:18px;color:var(--muted)}
.search svg{width:16px;height:16px;flex:0 0 16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search .x{display:none;color:var(--muted);font-size:18px;line-height:1}
.search.has .x{display:block}

/* document */
main{max-width:820px;margin:0 auto;padding:52px 28px 45vh}
#title{font-size:32px;font-weight:700;line-height:1.25;margin:0 0 18px 40px;outline:0;min-height:40px;white-space:pre-wrap;word-break:break-word}
#title:empty::before{content:"Untitled";color:var(--faint)}
.hint{margin:0 0 14px 40px;color:var(--muted);font-size:14px}
.item{position:relative}
.row{display:flex;align-items:flex-start;position:relative}
.dots{position:absolute;left:-26px;top:1px;width:24px;height:25px;display:grid;place-items:center;color:var(--faint);border-radius:4px;opacity:0}
.row:hover .dots{opacity:1}
.dots:hover{color:var(--text);background:var(--hover)}
.dots svg{width:16px;height:16px}
.tog{flex:0 0 20px;height:27px;display:grid;place-items:center;color:var(--faint);cursor:pointer}
.tog:hover{color:var(--text)}
.tog svg{width:9px;height:9px;transition:transform .12s ease}
.tog.open svg{transform:rotate(90deg)}
.tog.none{visibility:hidden}
.bullet{flex:0 0 20px;height:27px;display:grid;place-items:center;cursor:pointer}
.bullet::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bullet);transition:box-shadow .1s}
.bullet:hover::before,.bullet.closed::before{box-shadow:0 0 0 6px var(--halo)}
.text{flex:1;min-width:0;min-height:27px;padding:1.5px 4px 1.5px 7px;line-height:24px;outline:0;white-space:pre-wrap;word-break:break-word;caret-color:var(--text)}
.text.b{font-weight:700}
.children{margin-left:29.5px;border-left:1px solid var(--line)}
.item.done{opacity:.5}
.item.done>.row>.text{text-decoration:line-through}
.c-red{color:var(--c-red)}.c-orange{color:var(--c-orange)}.c-yellow{color:var(--c-yellow)}
.c-green{color:var(--c-green)}.c-blue{color:var(--c-blue)}.c-purple{color:var(--c-purple)}
.tag{color:var(--accent);cursor:pointer}
.tag:hover{text-decoration:underline}
.url{color:var(--accent);text-decoration:underline;text-decoration-color:var(--faint)}
.empty{margin-left:40px;padding:2px 7px;color:var(--faint);cursor:text}
.item.dragging{opacity:.35}
#drop{position:fixed;height:2px;background:var(--accent);pointer-events:none;display:none;border-radius:1px;z-index:50}

/* menus */
.menu{position:fixed;z-index:60;display:none;min-width:220px;padding:6px;background:var(--menu);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.menu.show{display:block}
.menu button.mi{display:flex;justify-content:space-between;gap:18px;width:100%;padding:7px 10px;border-radius:5px;text-align:left;font-size:14px}
.menu button.mi:hover{background:var(--hover)}
.menu kbd{color:var(--muted);font:12px/1.6 inherit}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.swatches{display:flex;gap:8px;padding:6px 10px 4px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent}
.sw:hover{outline:2px solid var(--line);outline-offset:1px}
.sw.none{border-color:var(--faint)}
.sw.cur{outline:2px solid var(--text);outline-offset:1px}

.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.45);padding:8vh 16px}
.modal.show{display:block}
.sheet{max-width:500px;margin:0 auto;background:var(--menu);border:1px solid var(--line);border-radius:10px;padding:20px 24px 16px;box-shadow:var(--shadow);max-height:84vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.sheet td:first-child{color:var(--muted);white-space:nowrap;padding-right:16px}
.sheet p{font-size:13px;color:var(--muted);margin:12px 0 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:7px;font-size:14px;display:none;max-width:90vw}
.toast.show{display:block}

@media (max-width:640px){
  .search{width:auto;flex:0 1 150px}
  .crumbs a{max-width:110px}
  main{padding:28px 14px 45vh}
  #title{font-size:26px}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <button class="ib" id="back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ib" id="fwd" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <button class="ib" id="home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <nav class="crumbs" id="crumbs"></nav>
  <label class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
    <button class="x" id="qx" title="Clear search">×</button>
  </label>
  <button class="ib" id="doneBtn" title="Show completed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  <button class="ib" id="themeBtn" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  <button class="ib" id="moreBtn" title="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
</div>

<main id="main">
  <h1 id="title" spellcheck="false"></h1>
  <div id="hint" class="hint" hidden></div>
  <div id="list"></div>
</main>

<div id="drop"></div>
<div class="menu" id="itemMenu"></div>
<div class="menu" id="moreMenu"></div>
<div class="modal" id="help"><div class="sheet" id="helpSheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json,.opml,.xml,.txt,.md" hidden>

<script>
(() => {
const KEY = 'outline-local-v1';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const mk = (text = '', children = [], x = {}) => ({ id: uid(), text, children, collapsed: false, done: false, ...x });
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl';
const ALT = isMac ? '⌥' : 'Alt';
const COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];

function seed() {
  const todo = mk('TO DO LIST', [
    mk('WEDNESDAY', [
      mk('Applied AI task force [Oct 15 to Katja]'), mk('Gates 2.0 [Sept 24]'), mk('Video Maikol'),
      mk('Sergio/Christian/Carlos'), mk('ESIR work'), mk('Revolut & BNP & CA?'),
      mk('Retour FR to do/olivier'), mk("Resa J'Go"), mk('Muscu'), mk('Trim')
    ], { color: 'green', bold: true }),
    mk('NEXT', [], { bold: true }),
    mk('ARCHIVES', [
      mk('ENGIE', [mk('lea rother'), mk('talent, compute and time')]),
      mk('SITRA/AIW proposal'), mk('ENGIE 1st workshou'), mk('ENGIE celine regnaukt')
    ], { bold: true })
  ]);
  return { root: { id: 'root', text: 'Home', children: [todo], collapsed: false, done: false }, zoom: todo.id, showDone: true, theme: 'dark' };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.root) return s; } catch (e) {}
  return null;
}
const fresh = !load();
let state = load() || seed();
if (state.showDone === undefined) state.showDone = true;
state.theme = state.theme || 'dark';

let index = new Map(), search = '', undoStack = [], redoStack = [], lastTyping = 0, saveT = null, warned = false;
const list = $('#list'), title = $('#title');

/* ---------- model helpers ---------- */
function reindex() { index.clear(); (function w(n, p) { index.set(n.id, { n, p }); n.children.forEach(c => w(c, n)); })(state.root, null); }
const node = id => index.get(id)?.n;
const parentOf = id => index.get(id)?.p;
const shown = n => state.showDone || !n.done;
function isDescendant(id, ancestorId) { let p = parentOf(id); while (p) { if (p.id === ancestorId) return true; p = parentOf(p.id); } return false; }
function removeNode(id) { const p = parentOf(id); p.children.splice(p.children.indexOf(node(id)), 1); }
const cloneNode = n => ({ ...n, id: uid(), children: n.children.map(cloneNode) });
const clean = s => s.replace(/\u00a0/g, ' ').replace(/\n/g, '');

/* ---------- persistence & history ---------- */
function save() { clearTimeout(saveT); saveT = setTimeout(flush, 250); }
function flush() {
  clearTimeout(saveT);
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { if (!warned) { warned = true; toast('Could not save to browser storage. Use Export to keep a copy.'); } }
}
addEventListener('beforeunload', flush);
const snapshot = () => JSON.stringify(state.root);
function pushHistory() { undoStack.push(snapshot()); if (undoStack.length > 300) undoStack.shift(); redoStack = []; lastTyping = 0; }
function snapTyping() { const now = Date.now(); if (now - lastTyping > 1000) { undoStack.push(snapshot()); redoStack = []; } lastTyping = now; }
function restore(from, to) {
  if (!from.length) return;
  const f = currentFocus();
  to.push(snapshot());
  state.root = JSON.parse(from.pop());
  lastTyping = 0;
  reindex();
  if (!node(state.zoom)) state.zoom = 'root';
  render(f && node(f.id) ? f : null);
}

/* ---------- caret ---------- */
function selOffsets(el) {
  const s = getSelection();
  if (!s.rangeCount || !el.contains(s.anchorNode)) return [0, 0];
  const r = s.getRangeAt(0), a = document.createRange();
  a.selectNodeContents(el); a.setEnd(r.startContainer, r.startOffset);
  const st = a.toString().length;
  a.setEnd(r.endContainer, r.endOffset);
  return [st, a.toString().length];
}
function setCaret(el, off) {
  el.focus();
  const r = document.createRange(), w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n, rem = off, placed = false;
  while ((n = w.nextNode())) { if (rem <= n.length) { r.setStart(n, rem); placed = true; break; } rem -= n.length; }
  if (!placed) { r.selectNodeContents(el); r.collapse(false); } else r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function caretRect() {
  const s = getSelection(); if (!s.rangeCount) return null;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(true);
  const rs = r.getClientRects(); return rs.length ? rs[0] : null;
}
const onFirstLine = t => { const r = caretRect(); return !r || r.top < t.getBoundingClientRect().top + 20; };
const onLastLine = t => { const r = caretRect(); return !r || r.bottom > t.getBoundingClientRect().bottom - 20; };
function currentFocus() {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('text')) return { id: a.dataset.id, off: selOffsets(a)[0] };
  return null;
}
const textEls = () => [...list.querySelectorAll('.text')];
const textEl = id => list.querySelector(`.text[data-id="${id}"]`);
function focusItem(id, off) {
  const t = textEl(id), n = node(id); if (!t || !n) return;
  setCaret(t, off === 'end' || off == null ? n.text.length : Math.min(off, n.text.length));
}

/* ---------- formatting ---------- */
const RX = /(https?:\/\/[^\s<]+)|(^|\s)([#@][\p{L}\p{N}_\-]+)/gu;
const fmt = t => esc(t).replace(RX, (m, url, pre, tag) => url ? `<span class="url">${url}</span>` : `${pre}<span class="tag">${tag}</span>`);

/* ---------- rendering ---------- */
const ICON_TOG = '<svg viewBox="0 0 10 10"><path d="M3 1.5L7.5 5 3 8.5z" fill="currentColor"/></svg>';
const ICON_DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

function render(focus) {
  reindex();
  if (!node(state.zoom)) state.zoom = 'root';
  const z = node(state.zoom);
  document.documentElement.dataset.theme = state.theme;
  $('#doneBtn').classList.toggle('on', state.showDone);
  $('#doneBtn').title = state.showDone ? 'Hide completed' : 'Show completed';
  renderCrumbs(z);

  if (document.activeElement !== title) title.textContent = z.id === 'root' ? 'Home' : z.text;
  title.contentEditable = z.id !== 'root' ? 'true' : 'false';
  title.className = z.color ? 'c-' + z.color : '';
  document.title = (z.id === 'root' ? 'Home' : z.text) || 'Outline';

  const q = search.trim().toLowerCase();
  let keep = null;
  if (q) {
    keep = new Set();
    (function m(n) {
      let hit = n.id !== z.id && n.text.toLowerCase().includes(q);
      for (const c of n.children) if (m(c)) hit = true;
      if (hit) keep.add(n.id);
      return hit;
    })(z);
  }
  const frag = document.createDocumentFragment();
  for (const c of z.children) { const e = buildNode(c, keep); if (e) frag.appendChild(e); }
  list.innerHTML = '';
  list.appendChild(frag);

  const hint = $('#hint');
  if (q) { const cnt = keep.size ? [...keep].filter(id => node(id).text.toLowerCase().includes(q)).length : 0;
    hint.hidden = false; hint.textContent = cnt ? `${cnt} match${cnt > 1 ? 'es' : ''} for “${search.trim()}”` : `No items match “${search.trim()}”`; }
  else hint.hidden = true;

  if (!q && !z.children.some(shown)) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Click or press Enter to add an item';
    e.onclick = () => addFirstChild(); list.appendChild(e);
  }
  if (focus) focusItem(focus.id, focus.off);
  save();
}

function buildNode(n, keep) {
  if (!shown(n)) return null;
  if (keep && !keep.has(n.id)) return null;
  const item = document.createElement('div');
  item.className = 'item' + (n.done ? ' done' : '');
  item.dataset.id = n.id;
  const kids = n.children.filter(c => shown(c) && (!keep || keep.has(c.id)));
  const hasKids = kids.length > 0;
  const open = keep ? true : !n.collapsed;
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML =
    `<button class="dots" tabindex="-1" title="Options">${ICON_DOTS}</button>` +
    `<span class="tog${hasKids ? '' : ' none'}${hasKids && open ? ' open' : ''}">${ICON_TOG}</span>` +
    `<span class="bullet${hasKids && !open ? ' closed' : ''}" draggable="true" title="Zoom in · right-click for options"></span>`;
  const t = document.createElement('div');
  t.className = 'text' + (n.color ? ' c-' + n.color : '') + (n.bold ? ' b' : '');
  t.contentEditable = 'true'; t.spellcheck = false; t.dataset.id = n.id;
  t.innerHTML = fmt(n.text);
  row.appendChild(t); item.appendChild(row);
  if (hasKids && open) {
    const ch = document.createElement('div'); ch.className = 'children';
    for (const c of n.children) { const e = buildNode(c, keep); if (e) ch.appendChild(e); }
    item.appendChild(ch);
  }
  return item;
}

function renderCrumbs(z) {
  const c = $('#crumbs'); c.innerHTML = '';
  const chain = []; let p = z; while (p) { chain.unshift(p); p = parentOf(p.id); }
  chain.slice(1).forEach(n => {
    const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; c.appendChild(s);
    const a = document.createElement('a'); a.textContent = n.text || 'Untitled'; a.title = n.text;
    a.onclick = () => zoomTo(n.id); c.appendChild(a);
  });
}

/* ---------- navigation ---------- */
let focusAfterZoom = false;
function zoomTo(id, focusFirst = false) {
  if (!node(id)) id = 'root';
  focusAfterZoom = focusFirst;
  if (decodeURIComponent(location.hash.slice(1)) !== id) location.hash = id;
  else applyZoom();
}
function applyZoom() {
  reindex();
  const id = decodeURIComponent(location.hash.slice(1)) || 'root';
  state.zoom = node(id) ? id : 'root';
  search = ''; $('#q').value = ''; $('#searchBox').classList.remove('has');
  render();
  scrollTo(0, 0);
  if (focusAfterZoom) { const f = textEls()[0]; if (f) focusItem(f.dataset.id, 'end'); else title.focus(); }
  focusAfterZoom = false;
}
addEventListener('hashchange', applyZoom);

function addFirstChild() {
  const z = node(state.zoom);
  pushHistory();
  const n = mk(''); z.children.unshift(n); z.collapsed = false;
  render({ id: n.id, off: 0 });
}

/* ---------- operations ---------- */
function indent(id, off) {
  const p = parentOf(id), a = p.children, i = a.indexOf(node(id));
  let j = i - 1; while (j >= 0 && !shown(a[j])) j--;
  if (j < 0) return;
  pushHistory();
  const prev = a[j]; a.splice(i, 1); prev.children.push(node(id)); prev.collapsed = false;
  render({ id, off });
}
function outdent(id, off) {
  const p = parentOf(id);
  if (!p || p.id === state.zoom) return;
  const gp = parentOf(p.id); if (!gp) return;
  pushHistory();
  const n = node(id); removeNode(id);
  gp.children.splice(gp.children.indexOf(p) + 1, 0, n);
  render({ id, off });
}
function moveSib(id, dir, off) {
  const a = parentOf(id).children, i = a.indexOf(node(id));
  let j = i + dir; while (j >= 0 && j < a.length && !shown(a[j])) j += dir;
  if (j < 0 || j >= a.length) return;
  pushHistory();
  const n = a[i]; a.splice(i, 1); a.splice(j, 0, n);
  render({ id, off });
}
function neighbourOutside(id) {
  const els = textEls(), t = textEl(id), k = els.indexOf(t);
  const item = t.closest('.item');
  const next = els.slice(k + 1).find(e => !item.contains(e));
  return { prev: els[k - 1]?.dataset.id, next: next?.dataset.id };
}
function toggleDone(id) {
  const n = node(id), f = currentFocus();
  pushHistory();
  n.done = !n.done;
  if (n.done && !state.showDone) {
    const { prev, next } = neighbourOutside(id);
    const target = next || prev;
    render(target ? { id: target, off: 'end' } : null);
  } else render(f && f.id === id ? f : { id, off: 'end' });
}
function deleteItem(id) {
  const { prev, next } = neighbourOutside(id);
  pushHistory(); removeNode(id);
  const target = prev || next;
  render(target ? { id: target, off: 'end' } : null);
  if (!target && title.isContentEditable) setCaret(title, title.textContent.length);
}
function setCollapsed(id, v) {
  const n = node(id); if (!n.children.length) return;
  n.collapsed = v; render(currentFocus());
}
function setAll(collapsed) {
  pushHistory();
  (function w(n) { if (n.children.length) n.collapsed = collapsed; n.children.forEach(w); })(node(state.zoom));
  node(state.zoom).collapsed = false;
  render(currentFocus());
}

/* ---------- editing events ---------- */
list.addEventListener('input', e => {
  const t = e.target.closest('.text'); if (!t || e.isComposing) return;
  syncText(t);
});
list.addEventListener('compositionend', e => { const t = e.target.closest('.text'); if (t) syncText(t); });
function syncText(t) {
  const n = node(t.dataset.id); if (!n) return;
  const txt = clean(t.textContent);
  if (txt !== n.text) { snapTyping(); n.text = txt; }
  if (/[#@]|https?:/.test(txt) || t.children.length) {
    const off = selOffsets(t)[0], html = fmt(txt);
    if (t.innerHTML !== html) { t.innerHTML = html; setCaret(t, off); }
  }
  save();
}

list.addEventListener('keydown', e => {
  const t = e.target.closest && e.target.closest('.text');
  if (!t || e.isComposing) return;
  const id = t.dataset.id, n = node(id), mod = e.metaKey || e.ctrlKey, k = e.key;
  const [s0, s1] = selOffsets(t);

  if (k === 'Enter' && mod) { e.preventDefault(); toggleDone(id); return; }
  if (k === 'Enter') {
    e.preventDefault();
    if (e.shiftKey) return;
    pushHistory();
    let txt = n.text, off = s0;
    if (s0 !== s1) { txt = txt.slice(0, s0) + txt.slice(s1); n.text = txt; }
    if (off === 0 && txt.length > 0) {
      const a = parentOf(id).children; a.splice(a.indexOf(n), 0, mk(''));
      render({ id, off: 0 }); return;
    }
    n.text = txt.slice(0, off);
    const nn = mk(txt.slice(off));
    if (n.children.some(shown) && !n.collapsed) n.children.unshift(nn);
    else { const a = parentOf(id).children; a.splice(a.indexOf(n) + 1, 0, nn); }
    render({ id: nn.id, off: 0 }); return;
  }
  if (k === 'Tab') { e.preventDefault(); e.shiftKey ? outdent(id, s0) : indent(id, s0); return; }
  if (k === 'Backspace' && mod && e.shiftKey) { e.preventDefault(); deleteItem(id); return; }
  if (k === 'Backspace' && s0 === 0 && s1 === 0) {
    const els = textEls(), prevEl = els[els.indexOf(t) - 1];
    if (n.children.length) { if (!n.text && !prevEl) e.preventDefault(); return; }
    e.preventDefault();
    if (!n.text) { deleteItem(id); return; }
    if (!prevEl) return;
    const pn = node(prevEl.dataset.id), L = pn.text.length;
    pushHistory(); pn.text += n.text; removeNode(id);
    render({ id: pn.id, off: L }); return;
  }
  if ((k === 'ArrowUp' || k === 'ArrowDown') && ((e.altKey && e.shiftKey) || (mod && e.shiftKey))) {
    e.preventDefault(); moveSib(id, k === 'ArrowUp' ? -1 : 1, s0); return;
  }
  if ((k === 'ArrowUp' || k === 'ArrowDown') && mod) { e.preventDefault(); setCollapsed(id, k === 'ArrowUp'); return; }
  if (k === 'ArrowRight' && e.altKey && !e.shiftKey) { e.preventDefault(); zoomTo(id, true); return; }
  if (k === 'ArrowLeft' && e.altKey && !e.shiftKey) {
    e.preventDefault();
    const z = node(state.zoom); if (z.id !== 'root') { const pz = parentOf(z.id); zoomTo(pz ? pz.id : 'root'); } return;
  }
  if ((k === 'ArrowUp' || k === 'ArrowDown') && !e.shiftKey && !e.altKey) {
    const up = k === 'ArrowUp';
    if (up ? !onFirstLine(t) : !onLastLine(t)) return;
    const els = textEls(), target = els[els.indexOf(t) + (up ? -1 : 1)];
    if (!target) { if (up && title.isContentEditable) { e.preventDefault(); setCaret(title, title.textContent.length); } return; }
    e.preventDefault();
    focusItem(target.dataset.id, s0); return;
  }
  if (mod && (k === 'b' || k === 'B')) { e.preventDefault(); pushHistory(); n.bold = !n.bold; render({ id, off: s0 }); return; }
  if (mod && /^[iuIU]$/.test(k)) { e.preventDefault(); return; }
  if (k === 'Escape') { t.blur(); }
});

list.addEventListener('paste', e => {
  const t = e.target.closest('.text'); if (!t) return;
  e.preventDefault();
  const raw = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
  const id = t.dataset.id, n = node(id), [a, b] = selOffsets(t);
  const lines = raw.replace(/\r/g, '').split('\n').filter(l => l.trim());
  pushHistory();
  if (lines.length <= 1) {
    const ins = (lines[0] || '').replace(/\t/g, ' ');
    n.text = n.text.slice(0, a) + ins + n.text.slice(b);
    t.innerHTML = fmt(n.text); setCaret(t, a + ins.length); save(); return;
  }
  const nodes = parseText(raw), arr = parentOf(id).children, i = arr.indexOf(n);
  if (!n.text.trim() && !n.children.length) arr.splice(i, 1, ...nodes);
  else arr.splice(i + 1, 0, ...nodes);
  render({ id: nodes[nodes.length - 1].id, off: 'end' });
});

/* title */
title.addEventListener('input', () => {
  const z = node(state.zoom); if (!z || z.id === 'root') return;
  const txt = clean(title.textContent); if (txt !== z.text) { snapTyping(); z.text = txt; }
  renderCrumbs(z); document.title = z.text || 'Outline'; save();
});
title.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'ArrowDown') {
    if (e.key === 'ArrowDown' && !onLastLine(title)) return;
    e.preventDefault();
    const f = textEls()[0];
    if (f) focusItem(f.dataset.id, 0); else addFirstChild();
  }
  if ((e.metaKey || e.ctrlKey) && /^[biuBIU]$/.test(e.key)) e.preventDefault();
});
title.addEventListener('paste', e => {
  e.preventDefault();
  const s = (e.clipboardData.getData('text/plain') || '').replace(/\s*\n\s*/g, ' ');
  const [a, b] = selOffsets(title), z = node(state.zoom);
  z.text = z.text.slice(0, a) + s + z.text.slice(b); title.textContent = z.text; setCaret(title, a + s.length);
  renderCrumbs(z); save();
});

/* clicks */
list.addEventListener('mousedown', e => {
  const tag = e.target.closest('.tag');
  if (tag && !e.shiftKey) { e.preventDefault(); setSearch(tag.textContent); return; }
  const url = e.target.closest('.url');
  if (url && (e.metaKey || e.ctrlKey)) { e.preventDefault(); window.open(url.textContent, '_blank', 'noopener'); }
});
list.addEventListener('click', e => {
  const item = e.target.closest('.item'); if (!item) return;
  const id = item.dataset.id;
  if (e.target.closest('.tog')) {
    if (search) return;
    const n = node(id); n.collapsed = !n.collapsed; render(currentFocus()); return;
  }
  if (e.target.closest('.bullet')) { zoomTo(id); return; }
  if (e.target.closest('.dots')) { const r = e.target.closest('.dots').getBoundingClientRect(); openItemMenu(id, r.left, r.bottom + 4); }
});
list.addEventListener('contextmenu', e => {
  const b = e.target.closest('.bullet,.dots'); if (!b) return;
  e.preventDefault(); openItemMenu(b.closest('.item').dataset.id, e.clientX, e.clientY);
});
$('#main').addEventListener('click', e => {
  if (e.target !== e.currentTarget && e.target !== list) return;
  const els = textEls(); if (els.length) focusItem(els[els.length - 1].dataset.id, 'end');
});

/* ---------- drag & drop ---------- */
let dragId = null, dropAt = null;
const dropBar = $('#drop');
list.addEventListener('dragstart', e => {
  const b = e.target.closest && e.target.closest('.bullet'); if (!b) return;
  const item = b.closest('.item'); dragId = item.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', node(dragId).text);
  requestAnimationFrame(() => item.classList.add('dragging'));
});
list.addEventListener('dragover', e => {
  if (!dragId) return;
  const row = e.target.closest('.row');
  if (!row) return;
  const tid = row.parentElement.dataset.id;
  if (tid === dragId || isDescendant(tid, dragId)) { dropBar.style.display = 'none'; dropAt = null; return; }
  e.preventDefault();
  const r = row.getBoundingClientRect(), br = row.querySelector('.bullet').getBoundingClientRect();
  const tn = node(tid), openKids = tn.children.some(shown) && !tn.collapsed;
  let mode = e.clientY < r.top + r.height / 2 ? 'before' : (e.clientX > br.right + 30 || openKids ? 'inside' : 'after');
  dropAt = { tid, mode };
  const left = mode === 'inside' ? br.left + 30 : br.left;
  Object.assign(dropBar.style, { display: 'block', left: left + 'px', width: Math.max(40, r.right - left) + 'px', top: (mode === 'before' ? r.top - 1 : r.bottom - 1) + 'px' });
});
list.addEventListener('drop', e => {
  if (!dragId || !dropAt) return;
  e.preventDefault();
  const n = node(dragId), { tid, mode } = dropAt;
  pushHistory(); removeNode(dragId);
  const tn = node(tid);
  if (mode === 'inside') { tn.children.unshift(n); tn.collapsed = false; }
  else { const a = parentOf(tid).children; a.splice(a.indexOf(tn) + (mode === 'after' ? 1 : 0), 0, n); }
  endDrag(); render();
});
function endDrag() { dragId = null; dropAt = null; dropBar.style.display = 'none'; list.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); }
list.addEventListener('dragend', endDrag);

/* ---------- menus ---------- */
const itemMenu = $('#itemMenu'), moreMenu = $('#moreMenu');
function place(menu, x, y) {
  menu.classList.add('show');
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
function closeMenus() { itemMenu.classList.remove('show'); moreMenu.classList.remove('show'); }
function openItemMenu(id, x, y) {
  closeMenus();
  const n = node(id);
  itemMenu.innerHTML =
    `<button class="mi" data-a="zoom">Zoom in<kbd>${ALT} →</kbd></button>` +
    `<button class="mi" data-a="done">${n.done ? 'Mark as not complete' : 'Complete'}<kbd>${MOD} ↵</kbd></button>` +
    `<button class="mi" data-a="bold">${n.bold ? 'Remove bold' : 'Bold'}<kbd>${MOD} B</kbd></button>` +
    `<div class="swatches">` +
      `<button class="sw none${n.color ? '' : ' cur'}" data-c="" title="No colour"></button>` +
      COLORS.map(c => `<button class="sw${n.color === c ? ' cur' : ''}" data-c="${c}" title="${c}" style="background:var(--c-${c})"></button>`).join('') +
    `</div><hr>` +
    `<button class="mi" data-a="expand">Expand all inside</button>` +
    `<button class="mi" data-a="dup">Duplicate</button>` +
    `<button class="mi" data-a="del">Delete<kbd>${MOD} ⇧ ⌫</kbd></button>`;
  itemMenu.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    closeMenus();
    if (b.dataset.c !== undefined) { pushHistory(); n.color = b.dataset.c || undefined; render(); return; }
    const a = b.dataset.a;
    if (a === 'zoom') zoomTo(id);
    if (a === 'done') toggleDone(id);
    if (a === 'bold') { pushHistory(); n.bold = !n.bold; render(); }
    if (a === 'expand') { pushHistory(); (function w(m) { m.collapsed = false; m.children.forEach(w); })(n); render(); }
    if (a === 'dup') { pushHistory(); const c = cloneNode(n), arr = parentOf(id).children; arr.splice(arr.indexOf(n) + 1, 0, c); render({ id: c.id, off: 'end' }); }
    if (a === 'del') deleteItem(id);
  };
  place(itemMenu, x, y);
}
$('#moreBtn').onclick = e => {
  e.stopPropagation();
  if (moreMenu.classList.contains('show')) { closeMenus(); return; }
  closeMenus();
  moreMenu.innerHTML =
    `<button class="mi" data-a="expand">Expand all</button>` +
    `<button class="mi" data-a="collapse">Collapse all</button><hr>` +
    `<button class="mi" data-a="copy">Copy this page as text</button>` +
    `<button class="mi" data-a="json">Export backup (.json)</button>` +
    `<button class="mi" data-a="opml">Export OPML (for WorkFlowy)</button>` +
    `<button class="mi" data-a="import">Import JSON, OPML or text…</button><hr>` +
    `<button class="mi" data-a="help">Keyboard shortcuts<kbd>?</kbd></button>`;
  moreMenu.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    closeMenus();
    ({
      expand: () => setAll(false), collapse: () => setAll(true),
      copy: () => copyText(toText(node(state.zoom).children)),
      json: () => download(`outline-${today()}.json`, JSON.stringify({ app: 'outline-local', version: 1, ...state }, null, 2), 'application/json'),
      opml: () => download(`outline-${today()}.opml`, toOPML(node(state.zoom)), 'text/x-opml'),
      import: () => $('#file').click(),
      help: openHelp
    })[b.dataset.a]();
  };
  const r = e.currentTarget.getBoundingClientRect();
  place(moreMenu, r.right - 240, r.bottom + 6);
};
document.addEventListener('mousedown', e => { if (!e.target.closest('.menu') && !e.target.closest('#moreBtn')) closeMenus(); });

/* ---------- import / export ---------- */
const today = () => new Date().toISOString().slice(0, 10);
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  toast('Exported ' + name);
}
function toText(nodes, d = 0) {
  return nodes.map(n => '  '.repeat(d) + '- ' + (n.done ? '[x] ' : '') + n.text + (n.children.length ? '\n' + toText(n.children, d + 1) : '')).join('\n');
}
const attr = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function toOPML(root) {
  const o = (n, d) => '  '.repeat(d) + `<outline text="${attr(n.text)}"${n.done ? ' _complete="true"' : ''}` +
    (n.children.length ? `>\n${n.children.map(c => o(c, d + 1)).join('\n')}\n${'  '.repeat(d)}</outline>` : '/>');
  return `<?xml version="1.0"?>\n<opml version="2.0">\n<head><title>${attr(root.text || 'Home')}</title></head>\n<body>\n${root.children.map(c => o(c, 1)).join('\n')}\n</body>\n</opml>`;
}
function stripTags(s) { return new DOMParser().parseFromString(s, 'text/html').body.textContent || ''; }
function fromOPML(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const body = doc.querySelector('body'); if (!body) throw new Error('No <body> in OPML');
  const conv = o => {
    const n = mk(stripTags(o.getAttribute('text') || '').replace(/\n/g, ' '));
    if (o.getAttribute('_complete') === 'true') n.done = true;
    n.children = [...o.children].filter(c => c.tagName === 'outline').map(conv);
    return n;
  };
  return [...body.children].filter(c => c.tagName === 'outline').map(conv);
}
function parseText(s) {
  const out = [], stack = [{ indent: -1, children: out }];
  for (const l of s.replace(/\r/g, '').split('\n')) {
    if (!l.trim()) continue;
    const m = l.match(/^(\s*)(?:[-*•]\s+|\d+[.)]\s+)?(.*)$/);
    const ind = m[1].replace(/\t/g, '    ').length;
    let text = m[2]; const done = /^\[x\]\s*/i.test(text); text = text.replace(/^\[[ x]\]\s*/i, '');
    const n = mk(text, [], { done });
    while (stack.length > 1 && stack[stack.length - 1].indent >= ind) stack.pop();
    stack[stack.length - 1].children.push(n);
    stack.push({ indent: ind, children: n.children });
  }
  return out;
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const s = await f.text();
    if (/\.json$/i.test(f.name)) {
      const d = JSON.parse(s); if (!d.root) throw new Error('Not an outline backup');
      if (!confirm('Replace your whole outline with this backup? You can undo right after.')) return;
      pushHistory(); state.root = d.root; state.zoom = 'root'; reindex(); location.hash = 'root'; render();
      toast('Backup restored');
    } else {
      const nodes = /<opml/i.test(s) ? fromOPML(s) : parseText(s);
      if (!nodes.length) throw new Error('Nothing to import');
      pushHistory(); node(state.zoom).children.push(...nodes); render();
      toast(`Imported ${nodes.length} item${nodes.length > 1 ? 's' : ''} into this page`);
    }
  } catch (err) { toast('Import failed: ' + err.message); }
});
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); }
  catch { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copied to clipboard');
}

/* ---------- toolbar ---------- */
$('#back').onclick = () => history.back();
$('#fwd').onclick = () => history.forward();
$('#home').onclick = () => zoomTo('root');
$('#doneBtn').onclick = () => { state.showDone = !state.showDone; render(currentFocus()); toast(state.showDone ? 'Showing completed items' : 'Hiding completed items'); };
$('#themeBtn').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(currentFocus()); };
function setSearch(v) { search = v; $('#q').value = v; $('#searchBox').classList.toggle('has', !!v); render(); }
$('#q').addEventListener('input', e => setSearch(e.target.value));
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { setSearch(''); e.target.blur(); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); const f = textEls()[0]; if (f) focusItem(f.dataset.id, 'end'); }
});
$('#qx').onclick = e => { e.preventDefault(); setSearch(''); };

/* ---------- global keys ---------- */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, inSearch = e.target === $('#q');
  if (e.key === 'Escape') { closeMenus(); $('#help').classList.remove('show'); }
  if (mod && !inSearch && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? restore(redoStack, undoStack) : restore(undoStack, redoStack); return; }
  if (mod && !inSearch && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); restore(redoStack, undoStack); return; }
  if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  const editing = e.target.isContentEditable || /INPUT|TEXTAREA/.test(e.target.tagName);
  if (!editing && e.key === '?') { e.preventDefault(); openHelp(); }
  if (!editing && e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

/* ---------- help ---------- */
function openHelp() {
  const rows = [
    ['Enter', 'New item (splits at the cursor)'],
    ['Tab / Shift Tab', 'Indent / outdent'],
    [`${MOD} Enter`, 'Complete or un-complete'],
    [`${MOD} ↑ / ↓`, 'Collapse / expand'],
    [`${ALT} ⇧ ↑ / ↓`, 'Move item up / down'],
    [`${ALT} → / ←`, 'Zoom in / out'],
    [`${MOD} B`, 'Bold item'],
    [`${MOD} ⇧ ⌫`, 'Delete item and its children'],
    [`${MOD} Z / ${MOD} ⇧ Z`, 'Undo / redo'],
    [`${MOD} K or /`, 'Search'],
    ['Click a bullet', 'Zoom into that item'],
    ['Right-click a bullet', 'Colour, duplicate, delete…'],
    ['Drag a bullet', 'Move the item (drop to the right to nest)'],
    ['Click #tag or @name', 'Filter by it'],
    [`${MOD}-click a link`, 'Open it'],
    ['Paste indented text', 'Creates nested items']
  ];
  $('#helpSheet').innerHTML = `<h2>Keyboard shortcuts</h2><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
    <p>Everything is saved in this browser only. Use More → Export backup now and then, and Import to move it to another browser.</p>`;
  $('#help').classList.add('show');
}
$('#help').addEventListener('click', e => { if (e.target.id === 'help') e.currentTarget.classList.remove('show'); });

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- boot ---------- */
reindex();
const h = decodeURIComponent(location.hash.slice(1));
if (h && node(h)) state.zoom = h;
else history.replaceState(null, '', '#' + state.zoom);
render();
if (fresh) setTimeout(() => toast('Press ? for keyboard shortcuts'), 400);
})();
</script>
</body>
</html>
