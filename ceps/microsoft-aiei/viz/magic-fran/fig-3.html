<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart specialization in the age of AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161a; --muted:#666b73; --faint:#9ba1a9; --rule:#dedcd6; --rail:#f7f6f3; --paper:#fff;
  --opt:#2f6f5e; --moon:#5b4a7a; --incr:#b0842e; --div:#9d9a93;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:52px 30px 60px}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:15px}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:33px;line-height:1.15;
  margin:0 0 13px;letter-spacing:-.014em;max-width:20ch}
.sub{font-size:14.5px;line-height:1.62;color:var(--muted);max-width:68ch;margin:0 0 8px}
.sub b{color:var(--ink);font-weight:600}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 0;margin:24px 0 4px}
.key i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-.5px}
svg{display:block;width:100%;height:auto;overflow:visible}
.qname{font-family:"Source Serif 4",Georgia,serif;font-size:18.5px;font-weight:600}
.qdo{font-size:11.5px;fill:var(--muted)}
.axbox{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.axname{font-size:12px;font-weight:600;letter-spacing:.03em}
.axmeas{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--muted)}
.dlab{font-size:10.5px;fill:var(--ink)}
.lead{stroke:var(--faint);stroke-width:.7;fill:none}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:36px}
.card{background:var(--paper);padding:16px 17px 15px;position:relative}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.card h3{font-family:"Source Serif 4",Georgia,serif;font-size:15.5px;font-weight:600;margin:0 0 4px}
.card .q{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--c);
  letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-bottom:9px}
.card p{margin:0;font-size:12px;line-height:1.6;color:var(--muted)}
.card p b{color:var(--ink);font-weight:600}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:11.5px;line-height:1.7;color:var(--muted);max-width:90ch}
footer p{margin:0 0 8px}footer b{color:var(--ink);font-weight:600}
.note{color:var(--faint)}
@media (max-width:900px){.wrap{padding:32px 14px 44px}h1{font-size:25px}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">


<div class="key">
  <span><i style="background:var(--opt)"></i>Optimal investments</span>
  <span><i style="background:var(--moon)"></i>Moonshot initiatives</span>
  <span><i style="background:var(--incr)"></i>Incremental growth</span>
  <span><i style="background:var(--div)"></i>Strategic divestment</span>
</div>

<svg id="s" viewBox="0 0 1160 780" preserveAspectRatio="xMidYMid meet"></svg>

<div class="cards" id="cards"></div>


</div>

<script>
/* name, AI applicability (0-100), relatedness density (0-100) */
const S=[
 ["Software & IT services",93,64],
 ["Pharmaceutical R&D",89,31],
 ["Semiconductor design",86,22],
 ["Medical diagnostics",83,44],
 ["Asset management",80,17],
 ["Aerospace design",77,86],
 ["Insurance",74,26],
 ["Legal services",71,55],
 ["Media & advertising",68,38],
 ["Scientific instruments",66,79],
 ["Banking",63,30],
 ["Accounting",60,58],
 ["Industrial machinery",57,91],
 ["Automotive",55,76],
 ["Telecommunications",53,47],
 ["Electronics",51,70],
 ["Energy networks",49,62],
 ["Chemicals",47,83],
 ["Management consulting",45,41],
 ["Precision agriculture",43,29],
 ["Logistics",40,73],
 ["Healthcare delivery",37,52],
 ["Higher education",35,66],
 ["Retail",32,45],
 ["Food processing",29,60],
 ["Wholesale trade",26,71],
 ["Construction",22,57],
 ["Real estate",19,36],
 ["Hospitality & tourism",15,48],
 ["Water & waste",11,64]
];
const QUAD=[
 {k:"opt", name:"Optimal investments", q:"High impact · High feasibility", c:"var(--opt)",
  do:"Build the strategy here",
  txt:"AI would transform the sector <b>and</b> the region already holds the complementary capabilities. Bets that are both worth making and achievable. Concentrate public support here."},
 {k:"moon",name:"Moonshot initiatives", q:"High impact · Low feasibility", c:"var(--moon)",
  do:"Bet selectively, and few",
  txt:"Real opportunity, but the complements must be built from a standing start. Costly and often unsuccessful; affordable mainly where fiscal and institutional capacity is deep. Pick one or two, not ten."},
 {k:"incr",name:"Incremental growth",  q:"Low impact · High feasibility", c:"var(--incr)",
  do:"Adopt, don't specialise",
  txt:"The region can move easily, but AI changes little about the sector. Worth adopting tools for efficiency; not a source of distinctive advantage, and not a basis for an <b>AI strategy</b>."},
 {k:"div", name:"Strategic divestment", q:"Low impact · Low feasibility", c:"var(--div)",
  do:"Don't allocate here",
  txt:"Neither transformative nor within reach. The label concerns <b>where public money should not go</b>: these sectors may remain economically useful, but they are not candidates for AI-led strategy."}
];

const W=1160,H=780, L=232,R=232,T=58,B=66;
const PW=W-L-R, PH=H-T-B, MX=50, MY=50;
const x=v=>L+v/100*PW, y=v=>T+(1-v/100)*PH;
const qOf=(ap,rd)=> ap>=MY ? (rd>=MX?QUAD[0]:QUAD[1]) : (rd>=MX?QUAD[2]:QUAD[3]);

/* ---- label layout: outward side, vertical de-collision, leader lines ---- */
const MIN=15.5;
const items=S.map(([nm,ap,rd],i)=>({nm,ap,rd,i,cx:x(rd),cy:y(ap),side:rd<MX?-1:1}));
[-1,1].forEach(sd=>{
  const g=items.filter(d=>d.side===sd).sort((a,b)=>a.cy-b.cy);
  g.forEach((d,k)=>{d.ly = k===0 ? d.cy : Math.max(d.cy, g[k-1].ly+MIN);});
  // pull back down if we overflowed the canvas
  let over=g.length?g[g.length-1].ly-(H-B+18):0;
  if(over>0) for(let k=g.length-1;k>=0;k--){
    g[k].ly-=over;
    if(k>0){const room=g[k].ly-MIN-g[k-1].ly; if(room>=0){over=0;break;} over=-room;}
  }
});

let o='';
[[MX,100,MY,100,'rgba(47,111,94,.055)'],[0,MX,MY,100,'rgba(91,74,122,.045)'],
 [MX,100,0,MY,'rgba(176,132,46,.04)'],[0,MX,0,MY,'rgba(20,22,26,.022)']]
 .forEach(([a,b,c,d,f])=>o+=`<rect x="${x(a)}" y="${y(d)}" width="${x(b)-x(a)}" height="${y(c)-y(d)}" fill="${f}"/>`);

o+=`<line x1="${x(MX)}" y1="${T-18}" x2="${x(MX)}" y2="${T+PH+18}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 5"/>`;
o+=`<line x1="${L-18}" y1="${y(MY)}" x2="${L+PW+18}" y2="${y(MY)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 5"/>`;
o+=`<path d="M${x(MX)},${T-28} l-5,10 h10 Z" fill="var(--ink)"/>`;
o+=`<path d="M${x(MX)},${T+PH+28} l-5,-10 h10 Z" fill="var(--ink)"/>`;
o+=`<path d="M${L+PW+28},${y(MY)} l-10,-5 v10 Z" fill="var(--ink)"/>`;
o+=`<path d="M${L-28},${y(MY)} l10,-5 v10 Z" fill="var(--ink)"/>`;

const box=(cx,cy,w,h,n,m)=>`<rect class="axbox" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}"/>
 <text class="axname" x="${cx}" y="${cy-3}" text-anchor="middle">${n}</text>
 <text class="axmeas" x="${cx}" y="${cy+11}" text-anchor="middle">${m}</text>`;
o+=box(x(MX),T-46,246,36,'HIGH ECONOMIC IMPACT','↑ AI applicability');
o+=box(x(MX),T+PH+46,246,36,'LOW ECONOMIC IMPACT','↓ AI applicability');
o+=box(L-116,y(MY),172,36,'LOW FEASIBILITY','↓ relatedness density');
o+=box(L+PW+116,y(MY),172,36,'HIGH FEASIBILITY','↑ relatedness density');

const qh=(cx,cy,q,al)=>`<text class="qname" x="${cx}" y="${cy}" text-anchor="${al}" fill="${q.c}">${q.name}</text>
 <text class="qdo" x="${cx}" y="${cy+16}" text-anchor="${al}">${q.do}</text>`;
o+=qh(x(MX)+16,T+24,QUAD[0],'start');
o+=qh(x(MX)-16,T+24,QUAD[1],'end');
o+=qh(x(MX)+16,T+PH-20,QUAD[2],'start');
o+=qh(x(MX)-16,T+PH-20,QUAD[3],'end');

items.forEach(d=>{
  const q=qOf(d.ap,d.rd), lx=d.cx+d.side*11, tx=d.cx+d.side*15;
  if(Math.abs(d.ly-d.cy)>1.5)
    o+=`<path class="lead" d="M${lx},${d.cy} L${lx+d.side*4},${d.ly}"/>`;
  o+=`<text class="dlab" x="${tx}" y="${d.ly+3.4}" text-anchor="${d.side===1?'start':'end'}">${d.nm}</text>`;
});
items.forEach(d=>{
  const q=qOf(d.ap,d.rd);
  o+=`<circle cx="${d.cx}" cy="${d.cy}" r="6.2" fill="${q.c}" fill-opacity=".85" stroke="#fff" stroke-width="1.5"/>`;
});
document.getElementById('s').innerHTML=o;

document.getElementById('cards').innerHTML=QUAD.map(q=>
 `<div class="card" style="--c:${q.c}"><div class="q">${q.q}</div>
  <h3>${q.name}</h3><p><b>${q.do}.</b> ${q.txt}</p></div>`).join('');
</script>
</body>
</html>
