<!doctype html>
<html>

<head>

    <meta charset="utf-8">
    <title>Forced Network</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #legend-container {
            flex: 0 0 auto;
            max-height: 12%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 1.2vh, 12px) clamp(8px, 3vw, 32px);
            background: rgba(255, 255, 255, 0.96);
            order: 2;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .custom-legend {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.5vw, 16px);
            width: 100%;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.5vw, 8px);
            font-weight: 600;
            color: #1b1d21;
            font-size: clamp(10px, 1.3vw, 16px);
            cursor: default;
            white-space: nowrap;
        }

        .legend-item.dim {
            opacity: 0.35;
        }

        .legend-square {
            width: clamp(10px, 1.2vw, 16px);
            height: clamp(10px, 1.2vw, 16px);
            flex-shrink: 0;
        }

        .legend-label {
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #legend-container {
                padding: 4px 8px;
                max-height: 18%;
            }

            .custom-legend {
                gap: 4px 8px;
            }

            .legend-item {
                font-size: 10px;
                gap: 3px;
            }

            .legend-square {
                width: 8px;
                height: 8px;
            }
        }

        svg.network {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            display: block;
            cursor: move;
            background: #ffffff;
            order: 1;
        }

        .link {
            stroke: rgba(140, 150, 170, 0.45);
        }

        .link.highlighted {
            stroke: rgba(80, 90, 110, 0.9);
            stroke-width: 6px;
        }

        .link.dimmed {
            opacity: 0.2;
        }

        .node.dimmed {
            opacity: 0.25;
        }

        .node.highlighted circle {
            stroke-width: 3px;
        }

        .node.highlighted text {
            font-weight: 700;
        }

        .node circle {
            stroke: #ffffff;
            stroke-width: 2px;
        }

        .node text {
            font-weight: 400;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }
    </style>

</head>

<body>

        <div class="custom-legend" id="legend"></div>
    </div>

    <svg class="network"></svg>
